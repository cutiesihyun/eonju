<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 점심 메뉴 추천 ☀️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 50%, #ffcc80 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        h1 {
            font-family: 'Jua', sans-serif;
            font-size: 2.3rem;
            color: #e65100;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .subtitle {
            color: #6d4c41;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .result-card {
            background: #fffde7;
            border: 2px dashed #ffe082;
            border-radius: 18px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .emoji {
            font-size: 5rem;
            margin-bottom: 15px;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .menu-name {
            font-family: 'Jua', sans-serif;
            font-size: 1.8rem;
            color: #3e2723;
        }

        .recommend-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.4rem;
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 124, 0, 0.35);
            transition: all 0.2s ease;
            outline: none;
        }

        .recommend-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(245, 124, 0, 0.45);
            background: linear-gradient(45deg, #fb8c00, #ef6c00);
        }

        .recommend-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(245, 124, 0, 0.3);
        }

        .category-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background-color: #ffe0b2;
            color: #e65100;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* 애니메이션 효과 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .bounce {
            animation: bounce 0.5s ease infinite;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>오늘 점심 뭐 먹지? ☀️</h1>
        <p class="subtitle">오늘 점심 고민 끝! 버튼을 눌러 점심 메뉴를 추천받아보세요.</p>

        <div class="result-card">
            <div id="emoji" class="emoji">🍱</div>
            <div id="menu" class="menu-name">버튼을 눌러주세요</div>
            <div id="category" class="category-tag" style="display: none;"></div>
        </div>

        <button class="recommend-btn" onclick="recommendMenu()">점심 메뉴 추천 🎲</button>
    </div>

    <script>
        const menuList = [
            { name: "김치찌개", emoji: "🍲", category: "한식" },
            { name: "된장찌개", emoji: "🍲", category: "한식" },
            { name: "제육볶음", emoji: "🥩", category: "한식" },
            { name: "비빔밥", emoji: "🥗", category: "한식" },
            { name: "돈가스", emoji: "🍱", category: "일식/경양식" },
            { name: "자장면", emoji: "🍜", category: "중식" },
            { name: "짬뽕", emoji: "🍜", category: "중식" },
            { name: "볶음밥", emoji: "🍛", category: "중식" },
            { name: "초밥", emoji: "🍣", category: "일식" },
            { name: "라멘", emoji: "🍜", category: "일식" },
            { name: "우동", emoji: "🍲", category: "일식" },
            { name: "파스타", emoji: "🍝", category: "양식" },
            { name: "햄버거", emoji: "🍔", category: "패스트푸드" },
            { name: "샌드위치", emoji: "🥪", category: "가벼운 식사" },
            { name: "떡볶이", emoji: "🥘", category: "분식" },
            { name: "김밥 & 라면", emoji: "🍙", category: "분식" },
            { name: "쌀국수", emoji: "🍜", category: "아시안" },
            { name: "마라탕", emoji: "🍲", category: "중식" },
            { name: "카레라이스", emoji: "🍛", category: "아시안" },
            { name: "순대국밥", emoji: "🍲", category: "한식" },
            { name: "부대찌개", emoji: "🥘", category: "한식" },
            { name: "포케/샐러드", emoji: "🥗", category: "가벼운 식사" }
        ];

        let isRecommending = false;

        function recommendMenu() {
            if (isRecommending) return;
            isRecommending = true;

            const emojiEl = document.getElementById("emoji");
            const menuEl = document.getElementById("menu");
            const categoryEl = document.getElementById("category");

            // 애니메이션 및 대기 효과
            emojiEl.classList.remove("pop-in");
            emojiEl.classList.add("bounce");
            menuEl.innerText = "추천 중...";
            categoryEl.style.display = "none";

            // 슬롯머신처럼 이모지가 빠르게 바뀌는 효과
            const interval = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiEl.innerText = randomTemp.emoji;
            }, 80);

            // 1.2초 후 최종 메뉴 확정
            setTimeout(() => {
                clearInterval(interval);
                emojiEl.classList.remove("bounce");

                const randomIndex = Math.floor(Math.random() * menuList.length);
                const selected = menuList[randomIndex];

                emojiEl.innerText = selected.emoji;
                menuEl.innerText = selected.name;
                categoryEl.innerText = `# ${selected.category}`;
                categoryEl.style.display = "inline-block";

                // 등장 효과 적용
                emojiEl.classList.add("pop-in");

                isRecommending = false;
            }, 1200);
        }
    </script>
</body>
</html>
